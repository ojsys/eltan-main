{% extends "membership/base.html" %}
{% load static %}
{% load crispy_forms_tags %}


{% block title %}
    Add SIGs
{% endblock title %}

{% block content %}
<div class="container">
    <div class="row">
        <div class="col-md-4"></div>
        <div class="col-md-4">
            <h2 class="mt-5 mb-5">Create a Special Interest Group</h2>
            <hr>
            <div class="row">
                <div class="col-md-12">
                    <form method="post">
                        {% csrf_token %}
                        {{ form | crispy }}
                        <button type="submit" class="btn btn-warning">Submit</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-4"></div>
    </div>
</div>

{% endblock content %}
