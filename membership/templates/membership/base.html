{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-D6VDFGP84T"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
    
      gtag('config', 'G-D6VDFGP84T');
    </script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock title %}</title>
    <!-- Fonts for consistent navbar appearance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!--- Slider Css -->
    <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700,800,900" rel="stylesheet">
		
    <link rel="stylesheet" href="{% static 'css/owl.carousel.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/owl.theme.default.min.css' %}">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/ionicons/4.5.6/css/ionicons.min.css">
	<link rel="stylesheet" href="{% static 'css/style1.css' %}">
    <link rel="stylesheet" href="{% static 'css/public-modern.css' %}">
	
	<!-- favicon -->
	{% if site_settings.favicon %}
	<link rel="icon" type="image/x-icon" href="{{ site_settings.favicon.url }}">
	{% else %}
	<link rel="icon" type="image/x-icon" href="{% static 'images/logo-eltan.jpeg' %}">
	{% endif %}
    
    <style>
        @media (max-width: 480px) {
            
            .main_nav{
                display: flex !important;
                flex-direction:column !important;
            }
            
        }
    </style>
    
  </head>
  <body>
    {% include 'partials/navbar.html' %}

    {% block content %}{% endblock content %}
    {% include 'partials/footer.html' %}
    
    <script src="{% static 'js/jquery.min.js' %}"></script>
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'js/owl.carousel.min.js' %}"></script>
    <script src="{% static 'js/main.js' %}"></script>
    <script type="text/javascript">
        $(document).ready(function() {
            $('.download-form').on('submit', function(e) {
                e.preventDefault();
                var form = $(this);
                var url = form.attr('action');
        
                $.ajax({
                    type: "POST",
                    url: url,
                    data: form.serialize(),
                    success: function(data) {
                        if(data.status === 'ok') {
                            // Open new tab/window for download
                            window.open(data.download_url, '_blank');
        
                            // Close the modal immediately after opening the download
                            $('#downloadModal' + data.resource_id).modal('hide');
                        } else {
                            alert('Failed to process download. Please try again.');
                        }
                    }
                });
            });
        });
    </script>
    <script type="text/javascript">
        $(document).ready(function() {
            if ("{{ messages }}" !== "") {
                // Assuming the modal is open when there's a message
                $('.modal').modal('hide'); // Adjust selector as needed
            }
        });
    </script>
        
    <script type="text/javascript">
        $.ajaxSetup({
            beforeSend: function(xhr, settings) {
                xhr.setRequestHeader("X-CSRFToken", "{{ csrf_token }}");
            }
        });
    </script>

    <script type="text/javascript">
        $(document).ready(function() {
            setTimeout(function() {
                $("#message-container").fadeOut("slow", function() {
                    // Remove the element from the DOM after fading out
                    $(this).remove();
                });
            }, 5000); // 5000 milliseconds = 5 seconds
        });
    </script>
    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', (event) => {
            setTimeout(() => {
                const messageContainer = document.getElementById('message-container');
                if (messageContainer) {
                    messageContainer.style.opacity = 0;
                    // Wait for the transition
                    setTimeout(() => messageContainer.remove(), 600); // Assume a 600ms fade out
                }
            }, 5000);
        });
    </script>
        
  </body>
</html>
