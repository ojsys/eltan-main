{% extends 'journal/base.html' %}
{% block journal_title %}Submissions closed — {{ journal.name }}{% endblock %}

{% block journal_content %}
<div class="jeltan-card" style="text-align:center; padding:4rem 1.5rem; max-width:640px; margin:0 auto;">
    <h1 class="jeltan-h1">Submissions are closed</h1>
    <p class="jeltan-muted" style="max-width:44ch; margin:0 auto 1.75rem;">{{ journal.closed_message }}</p>
    <div class="jeltan-btn-row" style="justify-content:center;">
        <a class="jeltan-btn-ghost" href="{% url 'journal:home' %}">Back to the journal</a>
        <a class="jeltan-btn-ghost" href="{% url 'journal:guidelines' %}">Author guidelines</a>
    </div>
</div>
{% endblock %}
